<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070B14" />
    <title>Offline — StrangeTheory</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #070b14;
        color: #f1f5f9;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        border: 1px solid #1e293b;
        background: #0e1525;
        border-radius: 16px;
        padding: 32px;
        text-align: center;
      }
      .badge {
        color: #22d3ee;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 12px 0 8px;
        font-size: 24px;
      }
      p {
        margin: 0 0 24px;
        font-size: 14px;
        line-height: 1.6;
        color: #94a3b8;
      }
      button {
        border: 0;
        border-radius: 10px;
        background: #22d3ee;
        color: #020617;
        font-weight: 600;
        font-size: 14px;
        padding: 10px 20px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">StrangeTheory · Offline</div>
      <h1>Connection paused</h1>
      <p>
        You appear to be offline. Your personal account and live community submissions require a connection so private data never leaks into offline storage.
      </p>
      <button type="button" onclick="window.location.reload()">Try Reconnecting</button>
    </main>
  </body>
</html>
